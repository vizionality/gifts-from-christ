services:
  db:
    image: mariadb:11
    container_name: sg-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WP_DB_NAME:-wordpress}
      MARIADB_USER: ${WP_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.9-php8.3-apache   # WooCommerce requires WP >= 6.9
    container_name: sg-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WP_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}
      # Secrets/config consumed by our mu-plugins.
      WORDPRESS_CONFIG_EXTRA: |
        define( 'HEADLESS_FRONTEND_URL', getenv('HEADLESS_FRONTEND_URL') ?: 'http://localhost:3000' );
        define( 'HEADLESS_HANDOFF_SECRET', getenv('HEADLESS_HANDOFF_SECRET') ?: 'dev-only-insecure-secret' );
      HEADLESS_FRONTEND_URL: ${HEADLESS_FRONTEND_URL:-http://localhost:3000}
      HEADLESS_HANDOFF_SECRET: ${HEADLESS_HANDOFF_SECRET:-dev-only-insecure-secret}
    volumes:
      - wp_data:/var/www/html
      # Our custom code is bind-mounted so it is versioned in this repo.
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins

  # One-shot container used to run the provisioning script:
  #   docker compose run --rm wpcli
  # Behind a profile so `docker compose up -d` does not start it before
  # WordPress has written its files.
  wpcli:
    image: wordpress:cli-php8.3
    container_name: sg-wpcli
    profiles: ["tools"]
    depends_on:
      - wordpress
    user: "33:33"
    environment:
      # www-data has no home directory in this image; wp-cli needs a writable
      # HOME for its package cache.
      HOME: /tmp
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WP_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wordpress}
      WP_URL: http://localhost:${WP_PORT:-8080}
      WP_TITLE: ${WP_TITLE:-Spiritual Gifts}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wordpress/scripts:/scripts
    entrypoint: ["/bin/sh"]
    command: ["/scripts/provision.sh"]

volumes:
  db_data:
  wp_data:
